name: 05 - Terraform Drift
on:
  workflow_dispatch: {}
  schedule: [{ cron: '30 2 * * *' }]
permissions: { id-token: write, contents: read }
env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
jobs:
  drift:
    if: ${{ vars.LAB_BOOTSTRAPPED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform -chdir=terraform init             -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"             -backend-config="key=aos-warranty/dev/terraform.tfstate"             -backend-config="region=${{ vars.AWS_REGION }}"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"
      - shell: bash
        run: |
          set +e
          terraform -chdir=terraform plan -detailed-exitcode -no-color
          code=$?
          set -e
          [[ "$code" == "0" ]] && { echo "No drift"; exit 0; }
          [[ "$code" == "2" ]] && { echo "DRIFT DETECTED"; exit 2; }
          exit 1
