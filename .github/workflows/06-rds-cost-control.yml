name: 06 - RDS Cost Control
on:
  workflow_dispatch:
    inputs:
      action:
        description: START or STOP
        required: true
        type: choice
        options: [STOP, START]
permissions: { id-token: write, contents: read }
env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
jobs:
  rds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform -chdir=terraform init             -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"             -backend-config="key=aos-warranty/dev/terraform.tfstate"             -backend-config="region=${{ vars.AWS_REGION }}"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"
      - run: |
          DB=$(terraform -chdir=terraform output -raw rds_identifier)
          if [[ "${{ inputs.action }}" == "STOP" ]]; then aws rds stop-db-instance --db-instance-identifier "$DB"; else aws rds start-db-instance --db-instance-identifier "$DB"; fi
