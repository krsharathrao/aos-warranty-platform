name: 07 - Destroy Lab
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY
        required: true
        type: string
permissions: { id-token: write, contents: read }
env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
jobs:
  destroy:
    if: ${{ inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform -chdir=terraform init             -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"             -backend-config="key=aos-warranty/dev/terraform.tfstate"             -backend-config="region=${{ vars.AWS_REGION }}"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"
      - run: terraform -chdir=terraform destroy -auto-approve
