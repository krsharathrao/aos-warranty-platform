name: 03 - Fresh Lab Bootstrap
on: { workflow_dispatch: {} }
permissions: { id-token: write, contents: read }
env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform -chdir=terraform init             -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"             -backend-config="key=aos-warranty/dev/terraform.tfstate"             -backend-config="region=${{ vars.AWS_REGION }}"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"
      - name: Create full lab
        run: terraform -chdir=terraform apply -auto-approve
      - name: Upload Glue scripts
        run: |
          BUCKET=$(terraform -chdir=terraform output -raw data_bucket_name)
          aws s3 cp glue/seed_source.py "s3://${BUCKET}/scripts/seed_source.py"
          aws s3 cp glue/ingest_raw.py "s3://${BUCKET}/scripts/ingest_raw.py"
          aws s3 cp glue/transform_silver.py "s3://${BUCKET}/scripts/transform_silver.py"
      - name: Seed and run complete pipeline
        run: bash scripts/run_full_pipeline.sh true
      - run: echo "Set LAB_BOOTSTRAPPED=true after verifying this workflow." >> "$GITHUB_STEP_SUMMARY"
